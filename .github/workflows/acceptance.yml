name: Acceptance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact commit or ref to evaluate
        required: true
      package_name:
        description: Already selected package identity (no publication)
        default: sqlite-vector-wasm-acceptance-fixture
      package_version:
        description: Already selected version (no publication)
        default: 0.0.0-test


permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.scope.outputs.required }}
      site_required: ${{ steps.site.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.pull_request.head.sha }}
      - name: Select package acceptance scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/acceptance/scope.py >> "$GITHUB_OUTPUT"
      - name: Select applicable Site merge checks
        id: site
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/site/gate.py scope >> "$GITHUB_OUTPUT"
      - name: Report site-only non-applicability
        if: steps.scope.outputs.required == 'false'
        run: echo 'Package acceptance not applicable. No package qualification was performed.' >> "$GITHUB_STEP_SUMMARY"

  composition:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.pull_request.head.sha }}
      - name: Install documented system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 curl ca-certificates unzip xz-utils nodejs \
            libglib2.0-0t64 libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libdbus-1-3 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxrandr2 libgbm1 libdrm2 libasound2t64
      - name: Qualify the exact PR candidate once
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/acceptance/candidate.mjs
      - name: Produce and accept exact final package
        if: github.event_name == 'workflow_dispatch'
        env:
          PACKAGE_NAME: ${{ inputs.package_name || 'sqlite-vector-wasm-acceptance-fixture' }}
          PACKAGE_VERSION: ${{ inputs.package_version || '0.0.0-test' }}
          SOURCE_LOCK: inputs/sqlite-vector.sources.lock.json
        run: bash tools/acceptance.sh --lock "$SOURCE_LOCK" --name "$PACKAGE_NAME" --version "$PACKAGE_VERSION"
      - name: Preserve available acceptance evidence and exact payload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/candidate/
            .work/acceptance/
            .work/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  site:
    needs: [scope, composition]
    if: >-
      always() && needs.scope.result == 'success' &&
      needs.scope.outputs.site_required == 'true' &&
      (needs.composition.result == 'success' ||
       (needs.scope.outputs.required == 'false' && needs.composition.result == 'skipped'))
    uses: ./.github/workflows/site.yml
    with:
      qualified_artifact: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      pages: write
      id-token: write

  acceptance:
    needs: [scope, composition, site]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.pull_request.head.sha }}
      - name: Require the Vector composition and evidence artifact
        env:
          CI_ACTION: complete
          SCOPE_RESULT: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          COMPOSITION_RESULT: ${{ needs.composition.result }}
        run: python3 tools/acceptance/ci.py >> "$GITHUB_STEP_SUMMARY"
      - name: Require applicable Site qualification and preview deployment
        env:
          SITE_REQUIRED: ${{ needs.scope.outputs.site_required }}
          SITE_RESULT: ${{ needs.site.result }}
        run: python3 tools/site/gate.py complete >> "$GITHUB_STEP_SUMMARY"

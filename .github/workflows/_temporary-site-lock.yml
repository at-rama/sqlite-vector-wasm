# Temporary generation workflow; removed by its own successful run.
name: Temporary site lockfile generation
on:
  push:
    branches: [fix/site-vite-6-security-2026-10-24]
    paths: [.github/workflows/_temporary-site-lock.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Resolve and validate locked site tooling
        shell: bash
        run: |
          set -euo pipefail
          cd tools/site
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package-lock.json')); if (p.packages[''].overrides?.vite !== undefined) { throw Error('unexpected override placement'); } if (p.packages['node_modules/vite'].version !== '6.4.5') throw Error('unexpected Vite version');"
          npm ci --include=dev --no-audit --no-fund
      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/site/package-lock.json
          git rm .github/workflows/_temporary-site-lock.yml
          git diff --cached --check
          git commit -m 'chore(site): regenerate lockfile for Vite 6.4.5'
          git push origin HEAD:refs/heads/fix/site-vite-6-security-2026-10-24

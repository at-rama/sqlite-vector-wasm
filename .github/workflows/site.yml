name: Site

on:
  pull_request:
    paths: &site-inputs
      - 'site/**'
      - 'tools/site/**'
      - 'tools/site.sh'
      - 'tools/harness/**'
      - 'tools/harness.sh'
      - 'tools/test-repository.sh'
      - 'README.md'
      - 'docs/usage.md'
      - 'docs/site.md'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths: *site-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HARNESS_STATE: ${{ runner.temp }}/site-harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install locked site dependencies
        run: sh tools/site.sh install
      - name: Run offline shell tests and build the site
        run: |
          node --test tools/site/tests/*.test.mjs
          sh tools/site.sh build
      - name: Install browser system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 curl ca-certificates unzip xz-utils \
            libglib2.0-0t64 libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libdbus-1-3 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxrandr2 libgbm1 libdrm2 libasound2t64
      - name: Check real builds and browser integration
        run: |
          bash tools/harness.sh install
          bash tools/harness.sh deps
          bash tools/harness.sh exec sh tools/site.sh exercise
      - name: Preserve shell exercise results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/site/build.json
            .work/site/exercise.json
            .work/site/mobile.png
          retention-days: 30
          if-no-files-found: error
      - name: Upload the validated site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .work/site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Updates
run-name: ${{ github.event_name == 'workflow_dispatch' && format('candidate sqlite={0} SQLite-Vector={1}', inputs.sqlite_version, inputs.sqlite_vector_version) || 'Updates PR rehearsal' }}

on:
  workflow_dispatch:
    inputs:
      sqlite_version:
        description: Exact SQLite version
        required: true
        type: string
      sqlite_vector_version:
        description: Exact SQLite-Vector version
        required: true
        type: string
      sqlite_comment:
        description: SQLite release comment
        default: ''
        type: string
      sqlite_vector_comment:
        description: SQLite-Vector release comment
        default: ''
        type: string
      misc_comment:
        description: Miscellaneous release comment
        default: ''
        type: string
  pull_request:

permissions:
  contents: read

jobs:
  rehearsal:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Select implementation rehearsal
        id: select
        run: |
          if test -f .42p/openspec/changes/prepare-sqlite-vector-candidate/tasks.md ||
             test -f .42p/openspec/changes/prepare-reviewed-release-candidates/tasks.md ||
             test -f .42p/openspec/changes/prepare-unqualified-candidate-pr/tasks.md; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install source preparation prerequisites
        if: steps.select.outputs.active == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl ca-certificates unzip xz-utils nodejs
      - name: Prepare coherent sources and pending candidate PR
        if: steps.select.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/updates.sh rehearsal
      - name: Preserve source preparation evidence and diagnostics
        if: always() && steps.select.outputs.active == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/updates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install source preparation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl ca-certificates unzip xz-utils nodejs
      - name: Prepare coherent sources and pending candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/updates.sh prepare
      - name: Preserve source preparation evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/updates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

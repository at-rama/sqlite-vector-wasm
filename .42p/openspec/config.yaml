schema: spec-driven
context: |
  Instituted decisions and sources ground the design.
  Distinct current Captures retain reconciled non-authoritative
  working projections; one global Allocation organizes responsibility coverage.
  OpenSpec contractualizes realization, followed by implementation and Verification.
  Captures do not institute decisions or corroborate themselves. Instituted
  sources retain authority; historical Distribution contract provenance is immutable.
  Current Captures and Allocation live in .42p/engineering/ relative to the
  repository root (parent of this project root). README is public documentation.
  A-site consumes the published canonical runtime without extending the package
  API, publication responsibility or canonical runtime distributions.
  Every Change MUST realize exactly one allocation unit and MUST NOT add unallocated product
  requirements. Insufficiency, contradiction or required upstream semantic change
  MUST cause escalation; never reinterpret upstream authority locally.
  Design and canon evolution, including governance tooling, is exempt from Changes.
  Follow standards/gates.md for PR checks/tests and declared-Change merge gates.
  Gates do not classify implementation changes or establish evidence freshness.
  Before Apply, allocation unit -> Change and Change -> allocation unit coverage MUST
  both be 100% for that unit, not the complete Allocation.
  openspec/specs/ is the cumulative synchronized realization canon derived
  from Allocation, not a second product specification or implementation evidence.
  Apply MUST respect the Change and repository standards.
  When post-Apply Verification is invoked, use the repository-owned
  .agents/skills/42p-verify-change/SKILL.md under standards/verification.md.
  It confirms 100% bidirectional
  allocation-unit/Change coverage, delegates to the intact generated
  openspec-verify-change skill, and runs repository
  checks and applicable tests. These three controls constitute 42P Verification;
  do not add a fourth verification procedure. Follow the standard's report
  prerequisite and stop rules: write and commit verification.md in the selected
  Change directory with the versioned YAML verdict and available evidence,
  including failures or blockers; return a diagnostic if report prerequisites
  are unresolved. The official skill must be available before invocation;
  installation and updates belong to separate preparation.
  Verification MUST precede archive; completed tasks and structural validation
  alone cannot establish it. Archive does not authorize merge or publication.
  Read ../AGENTS.md, standards/openspec.md and standards/verification.md. Normal CLI commands MUST run from
  this .42p project root. Use local OpenSpec only; no Store or --store.
